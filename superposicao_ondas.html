<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superposição de ondas — diferença de fase</title><style>
:root{--blue:#2e598d;--pale:#c2d9ed;--panel:#d2d8e9;--ink:#172b43;--copper:#b18b70;--orange:#f28b19;--red:#c74c51}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#fff;color:var(--ink);margin:0;padding:28px}main{max-width:1120px;margin:auto}h1{font-size:30px;color:var(--blue);margin:0 0 10px;font-weight:750}h1:after{content:"";display:block;width:85px;height:9px;background:var(--pale);margin-top:9px}p{line-height:1.6}.equations{background:#d2d8e9;padding:15px 20px;border-radius:9px;font-family:Georgia,serif;font-size:19px}.controls{background:#f4f7fb;border:1px solid #c2d9ed;border-radius:12px;padding:18px 20px;margin:16px 0}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}input[type=range]{flex:1;min-width:180px;accent-color:var(--blue)}button{padding:10px 19px;border:1px solid #a9bed2;border-radius:8px;background:#d2d8e9;color:var(--ink);font-weight:700;cursor:pointer}button:hover{background:#c2d9ed}.legend{display:flex;gap:22px;flex-wrap:wrap;margin:17px 0;font-weight:600}.legend span:before{content:'━';font-weight:bold;margin-right:8px}.blue{color:var(--blue)}.red{color:var(--red)}.green{color:var(--copper)}canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #c2d9ed;border-radius:10px}#readout{font-weight:bold;background:#d2d8e9;border-radius:8px;padding:13px 17px;color:var(--blue)}small{color:#65758a}@media(max-width:600px){body{padding:15px}h1{font-size:24px}.equations{font-size:16px}}
</style></head><body><main><h1>Superposição de duas ondas harmônicas</h1><p class="equations">y₁ = A sen(kx − ωt) &nbsp;&nbsp; y₂ = A sen(kx − ωt + φ) &nbsp;&nbsp; yᵣ = y₁ + y₂</p><div class="controls"><div class="row"><label for="phase">Diferença de fase: <strong id="phaseLabel">90°</strong></label><input id="phase" type="range" min="0" max="360" step="1" value="90"><button id="play">Pausar</button><button id="reset">Reiniciar</button></div></div><div class="legend"><span class="blue">Onda 1</span><span class="red">Onda 2</span><span class="green">Resultante</span></div><canvas id="graph" width="1100" height="520"></canvas><p id="readout"></p><p><small>Use o controle para variar φ de 0° a 360°. Funciona sem internet. Para apresentar, abra este arquivo no navegador e pressione F11 para tela cheia.</small></p></main><script>const c=document.getElementById('graph'),ctx=c.getContext('2d'),phase=document.getElementById('phase'),label=document.getElementById('phaseLabel'),readout=document.getElementById('readout'),play=document.getElementById('play');let t=0,running=true,last=0;const L=65,R=25,T=35,B=55,W=c.width,H=c.height,m=(T+H-B)/2,s=90;function update(){let p=Number(phase.value);label.textContent=p+'° ('+(p*Math.PI/180).toFixed(2)+' rad)';readout.textContent='Amplitude da resultante: '+(2*Math.abs(Math.cos(p*Math.PI/360))).toFixed(2).replace('.',',')+' A';}function draw(){ctx.clearRect(0,0,W,H);ctx.font='17px Arial';ctx.textAlign='right';for(let n=-2;n<=2;n++){let y=m-n*s;ctx.strokeStyle='#e5ebf2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillStyle='#536780';ctx.fillText(n,L-12,y+5)}ctx.strokeStyle='#243b55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,H-B);ctx.moveTo(L,m);ctx.lineTo(W-R,m);ctx.stroke();ctx.textAlign='center';for(let n=0;n<=4;n++){let x=L+n*(W-L-R)/4;ctx.fillText(n===0?'0':n+'π',x,H-20)}ctx.fillText('x',W-20,m-13);ctx.fillText('y/A',L+25,T+4);let p=Number(phase.value)*Math.PI/180;[[q=>Math.sin(q-t),'#2e598d',2.8],[q=>Math.sin(q-t+p),'#c74c51',2.8],[q=>Math.sin(q-t)+Math.sin(q-t+p),'#b18b70',4]].forEach(([f,color,lw])=>{ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();for(let i=0;i<=1000;i++){let x=L+(W-L-R)*i/1000,q=4*Math.PI*i/1000,y=m-s*f(q);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()})}function frame(now){if(last&&running)t+=Math.min((now-last)/1000,.1)*1.5;last=now;draw();requestAnimationFrame(frame)}phase.addEventListener('input',update);play.onclick=()=>{running=!running;play.textContent=running?'Pausar':'Reproduzir'};document.getElementById('reset').onclick=()=>{t=0;phase.value=90;update()};update();requestAnimationFrame(frame);</script></body></html>
